[project]
name = "mujoco-lerobot"
version = "0.1.0"
description = "MuJoCo-based LeRobot simulation environment for data collection and policy evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "lerobot[dataset,training]>=0.6.1",
    "lerobot_env_mujoco_lerobot",
    "lerobot_policy_Adaptive_ACT",
    "mink>=1.2.0",
    "mujoco>=3.11.0",
    "mujoco-camrender",
    "mujoco-lerobot-core",
    "numpy>=2.2.6",
    "pybind11>=3.0.4",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
mujoco-camrender = { path = "libs/mujoco_camrender", editable = true }
mujoco-lerobot-core = { path = "src/mujoco_lerobot", editable = true }
lerobot_env_mujoco_lerobot = { path = "src/lerobot_env_mujoco_lerobot", editable = true }
lerobot_policy_Adaptive_ACT = { path = "src/lerobot_policy_Adaptive_ACT", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_testing_ros_pytest_entrypoint"
markers = [
    "slow: 慢速测试（需要训练 checkpoint / 长耗时），可用 -m 'not slow' 跳过",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
