[project]
name = "lerobot_policy_mujoco_lerobot_example"
version = "0.1.0"
description = "Example LeRobot policy plugin consuming mujoco-lerobot dataset-format observations"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_policy_mujoco_lerobot_example"]
