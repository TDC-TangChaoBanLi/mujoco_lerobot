[project]
name = "lerobot_policy_Adaptive_ACT"
version = "0.1.0"
description = "Adaptive ACT policy plugin for LeRobot: arbitrary image channels + per-camera-group vision backbones"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.0",
    "lerobot>=0.6.1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_policy_Adaptive_ACT"]
