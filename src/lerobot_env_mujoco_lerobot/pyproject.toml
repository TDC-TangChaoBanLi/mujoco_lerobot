[project]
name = "lerobot_env_mujoco_lerobot"
version = "0.1.0"
description = "LeRobot third-party environment plugin (EnvConfig) for mujoco-lerobot"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_env_mujoco_lerobot"]
