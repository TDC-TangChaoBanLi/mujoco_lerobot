# push_t 场景配置（与 assets/mujoco/scenes/push_t.xml 对应）
# 机器人挂载工作区 +x 侧，default_qpos pan=π 使 TCP 初始落在工作区上方。
# 相机参数（image_size/fps）是渲染的实际参数；
# 深度范围（depth_range）不属于渲染参数，由数据集配置定义。

# ── 机器人 ──
robot:
  - name: "ur5e"            # 机器人名称，仅用于标识
    prefix: ""              # 机器人前缀，用于修饰 joint / site 的 name
    arm_joints:
      - ur_shoulder_pan_joint
      - ur_shoulder_lift_joint
      - ur_elbow_joint
      - ur_wrist_1_joint
      - ur_wrist_2_joint
      - ur_wrist_3_joint
    gripper_joints:
      - robotiq_85_left_knuckle_joint
    ee_site: "_tcp"
    # pan=π 使臂朝向工作区（-x 方向）；其余关节组合使 TCP 初始落点在
    # (0.34, -0.13, 0.69)，恰在可推动高度带 [0.66, 0.72] 内，开局即可推 T。
    default_qpos: [3.14159, -1.0, 1.8, -2.2, -1.57, 0.0]
    # IK 求解器参数（mink），含义见 src/mujoco_lerobot/simulate/ik_solver.py
    ik_solver:
      vel_limit: [3.1416, 3.1416, 3.1416, 3.1416, 3.1416, 3.1416] # 关节角速度限制 (rad/s)

# ── 视角（评估可视化 / 数据采集初始视角 / eval 视频渲染）──
view:
  lookat: [0.35, 0.0, 0.65]  # 相机注视点（工作区中心）
  distance: 1.6               # 相机距离
  elevation: -30.0            # 俯仰角（度）
  azimuth: 135.0              # 方位角（度）
  image_size: [640, 480]      # eval 视频分辨率 (W, H)

# ── 相机 ──
camera:
  - name: "global_realsense_link_CAMERA"   # 全局俯视相机
    fps: 30
    image_size: [640, 480]
    type: "rgb_depth"
  - name: "realsense_link_CAMERA"   # 与 mjcf 中的 camera name 一致（手眼）
    fps: 30                          # 相机渲染帧率
    image_size: [640, 480]           # 图像尺寸 (W, H)
    type: "rgb_depth"                # "gray" | "rgb" | "depth" | "rgb_depth"
