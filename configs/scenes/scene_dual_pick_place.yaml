# 双臂 Pick-and-Place 场景配置（与 assets/mujoco/scenes/dual_pick_place.xml 对应）
# 相机参数（image_size/fps）是渲染的实际参数；
# 若与 mjcf 中 camera 的 resolution/fovy 冲突，加载时会打印警告。
# 深度范围（depth_range）不属于渲染参数，由数据集配置定义
# （configs/dataset/dataset_dual_pick_place.yaml → state.camera.depth_range）。

# ── 机器人 ──
robot:
  - name: "A_ur5e"
    prefix: "A_"
    arm_joints:
      - ur_shoulder_pan_joint
      - ur_shoulder_lift_joint
      - ur_elbow_joint
      - ur_wrist_1_joint
      - ur_wrist_2_joint
      - ur_wrist_3_joint
    gripper_joints:
      - robotiq_85_left_knuckle_joint
    ee_site: "_tcp"
    default_qpos: [0.0, -1.32, 1.32, -1.57, -1.57, 0.0]
    # IK 求解器参数（mink），含义见 src/mujoco_lerobot/simulate/ik_solver.py
    ik_solver:
      vel_limit: [3.1416, 3.1416, 3.1416, 3.1416, 3.1416, 3.1416] # 关节角速度限制 (rad/s)
      # collision_avoidance 默认关闭；开启示例（双臂互碰避免 + 腕部避桌面）：
      # collision_avoidance:
      #   enabled: true
      #   pairs:
      #     - [["A_ur_wrist_3_link"], ["B_ur_wrist_3_link", "B_robotiq_85_base_link"]]
      #     - [["A_ur_wrist_3_link"], ["table_surface"]]

  - name: "B_ur5e"
    prefix: "B_"
    arm_joints:
      - ur_shoulder_pan_joint
      - ur_shoulder_lift_joint
      - ur_elbow_joint
      - ur_wrist_1_joint
      - ur_wrist_2_joint
      - ur_wrist_3_joint
    gripper_joints:
      - robotiq_85_left_knuckle_joint
    ee_site: "_tcp"
    default_qpos: [0.0, -1.32, 1.32, -1.57, -1.57, 0.0]
    ik_solver:
      vel_limit: [3.1416, 3.1416, 3.1416, 3.1416, 3.1416, 3.1416] # 关节角速度限制 (rad/s)

# ── 视角（评估可视化 / 数据采集初始视角 / eval 视频渲染）──
view:
  lookat: [0.0, 0.0, 0.65]
  distance: 1.8
  elevation: -30.0
  azimuth: 135.0
  image_size: [640, 480]      # eval 视频分辨率 (W, H)

# ── 相机 ──
camera:
  - name: "global_realsense_link_CAMERA"
    fps: 30
    image_size: [640, 480]
    type: "rgb_depth"
  - name: "A_realsense_link_CAMERA"
    fps: 30
    image_size: [640, 480]
    type: "rgb_depth"
  - name: "B_realsense_link_CAMERA"
    fps: 30
    image_size: [640, 480]
    type: "rgb_depth"
